                    <button class="copy-btn" id="copy-btn" data-i18n="buttons.copy">복사</button>

                    </div>
                </div>

                <!-- Strength Indicator -->
                <div class="strength-section">
                    <div class="strength-label">
                        <span data-i18n="labels.strength">강도:</span>
                        <span class="strength-text" id="strength-text"></span>
                    </div>
                    <div class="strength-bar">
                        <div class="strength-fill" id="strength-fill"></div>
                    </div>
                </div>
            </div>

            <!-- Password Options Section -->
            <div class="options-section">
                <div class="length-section">
                    <div class="length-header">
                        <label data-i18n="labels.length">비밀번호 길이</label>
                        <span class="length-value" id="length-value">16</span>
                    </div>
                    <input type="range" id="length-slider" min="8" max="64" value="16" class="length-slider">
                    <div class="length-range">
                        <span>8</span>
                        <span>64</span>
                    </div>
                </div>

                <!-- Checkboxes -->
                <div class="options-grid">
                    <label class="option-checkbox">
                        <input type="checkbox" id="uppercase-check" checked>
                        <span class="checkbox-label" data-i18n="options.uppercase">대문자 (A-Z)</span>
                    </label>
                    <label class="option-checkbox">
                        <input type="checkbox" id="lowercase-check" checked>
                        <span class="checkbox-label" data-i18n="options.lowercase">소문자 (a-z)</span>
                    </label>
                    <label class="option-checkbox">
                        <input type="checkbox" id="numbers-check" checked>
                        <span class="checkbox-label" data-i18n="options.numbers">숫자 (0-9)</span>
                    </label>
                    <label class="option-checkbox">
                        <input type="checkbox" id="special-check" checked>
                        <span class="checkbox-label" data-i18n="options.special">특수문자 (!@#$%)</span>
                    </label>
                </div>

                <!-- Generate Button -->
                <button class="generate-btn" id="generate-btn" data-i18n="buttons.generate">새로 생성</button>
            </div>

            <!-- Password History Section -->
